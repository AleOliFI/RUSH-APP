<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="RUSH">
  <!--
    Favicon: so o simbolo. Num quadrado de 48px o wordmark seria
    ilegivel, e texto em favicon depende de uma fonte que o
    navegador nao carrega aqui. As tres barras sao a parte da
    marca que sobrevive ao tamanho.

    As barras sao as MESMAS do logo, sem redesenho: a transformacao
    leva o simbolo original (x 12..66, y 12..36) para dentro do
    quadrado com 6px de margem dos dois lados.
  -->
  <rect width="48" height="48" rx="10" fill="#0D0D0D"/>
  <g transform="translate(6,16) scale(0.6667) translate(-12,-12)">
    <path d="M12 36L28 12H38L22 36H12Z" fill="#FF5500"/>
    <path d="M26 36L42 12H52L36 36H26Z" fill="#FF7700"/>
    <path d="M40 36L56 12H66L50 36H40Z" fill="#FF9933"/>
  </g>
</svg>
