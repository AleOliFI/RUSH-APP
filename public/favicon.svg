<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="RUSH RUNNING">
  <!--
    Favicon: so o simbolo. Num quadrado de 48px o wordmark seria
    ilegivel, e texto em favicon depende de uma fonte que o
    navegador nao carrega aqui. As tres barras sao a parte da
    marca que sobrevive ao tamanho.

    As barras sao as MESMAS do logo, sem redesenho: a transformacao
    leva o simbolo original (x 10..64, y 12..36) para dentro do
    quadrado com 6px de margem dos dois lados.
  -->
  <rect width="48" height="48" rx="10" fill="#0D0D0D"/>
  <g transform="translate(6,16) scale(0.6667) translate(-10,-12)">
    <path d="M10 36L26 12H36L20 36H10Z" fill="#FF5500"/>
    <path d="M24 36L40 12H50L34 36H24Z" fill="#FF7700"/>
    <path d="M38 36L54 12H64L48 36H38Z" fill="#FFAA00"/>
  </g>
</svg>
