name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # O projeto tem conflitos de peer deps (Expo 56 + RN 0.85), então o lock
      # é resolvido com --legacy-peer-deps; o ci precisa usar a mesma flag.
      - run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      # Cobre a lógica pura de VFC. Existe porque a filtragem de artefato já
      # foi removida uma vez sem ninguém notar, e um RMSSD inflado vira
      # prescrição de treino forte para quem deveria descansar.
      - name: Testes
        run: npx jest
