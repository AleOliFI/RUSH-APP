name: Desenvolvimento Diário RUSH-APP

on:
  schedule:
    - cron: '0 12 * * *'  # 9h BRT (UTC−3)
  workflow_dispatch: {}   # gatilho manual para testar

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A action não aceita `prompt_file`; o conteúdo precisa ir inline.
      - name: Carregar prompt diário
        id: prompt
        run: |
          {
            echo 'text<<DAILY_PROMPT_EOF'
            cat docs/DAILY_PROMPT.md
            echo 'DAILY_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Executar Claude Code — desenvolvimento diário
        uses: anthropics/claude-code-action@beta
        with:
          # 'agent' é obrigatório para eventos de automação (schedule);
          # o modo padrão ('tag') só responde a menções em issues/PRs.
          mode: agent
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: ${{ steps.prompt.outputs.text }}
