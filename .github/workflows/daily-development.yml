name: Desenvolvimento Diário RUSH-APP

on:
  schedule:
    - cron: '0 12 * * *'  # 9h BRT (UTC−3)
  workflow_dispatch: {}   # gatilho manual para testar

permissions:
  contents: write
  pull-requests: write

jobs:
  daily-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Claude Code — desenvolvimento diário
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt_file: docs/DAILY_PROMPT.md
